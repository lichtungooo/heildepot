services:
  heildepot:
    image: ghcr.io/lichtungooo/heildepot:latest
    network_mode: bridge
    restart: unless-stopped
    volumes:
      - heildepot-data:/data
    environment:
      - DB_PATH=/data/data.db
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASS=${ADMIN_PASS}
      - FRONTEND_URL=https://heildepot.eli.eco
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.heildepot.rule=Host(`heildepot.eli.eco`)"
      - "traefik.http.routers.heildepot.entrypoints=websecure"
      - "traefik.http.routers.heildepot.tls.certresolver=letsencrypt"
      - "traefik.http.services.heildepot.loadbalancer.server.port=3001"

volumes:
  heildepot-data:
