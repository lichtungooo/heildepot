name: Wissen

# Prüft die Dokumente unter wissen/ gegen die Daten (Forge, DEFINITION 119.R2).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        working-directory: app
