name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: app
        run: |
          npm install
          # Override base path for Hetzner deployment
          sed -i "s|base: '/heildepot-prototyp/'|base: '/heildepot/'|" vite.config.js
          npm run build

      - name: Deploy Frontend via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: www194.your-server.de
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          local-dir: ./app/dist/
          server-dir: /public_html/heildepot/
          dangerous-clean-slate: false
